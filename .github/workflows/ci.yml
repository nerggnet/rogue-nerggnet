name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} / GHC ${{ matrix.ghc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Add newer GHC versions here once they have been tried locally.
        os: [ubuntu-latest, macos-latest]
        ghc: ['9.12.2', '9.14.1']

    steps:
      - uses: actions/checkout@v4

      - name: Set up GHC and cabal
        uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: 'latest'

      - name: Treat warnings as errors for this package only
        run: |
          cat >> cabal.project.local <<'PROJ'
          package rogue-nerggnet
            ghc-options: -Werror
          PROJ

      - name: Resolve dependencies
        run: cabal build all --dry-run

      - name: Restore cached dependencies
        uses: actions/cache/restore@v4
        id: cache
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-ghc${{ matrix.ghc }}-${{ hashFiles('**/plan.json') }}
          restore-keys: ${{ runner.os }}-ghc${{ matrix.ghc }}-

      - name: Build dependencies
        run: cabal build all --only-dependencies

      - name: Save cached dependencies
        uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-primary-key != steps.cache.outputs.cache-matched-key
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build
        run: cabal build all

      # The save/load specs read the real world.json, so this has to run from
      # the repository root.
      - name: Test
        run: cabal test all --test-show-details=direct

      - name: Check the package metadata
        run: cabal check

  hlint:
    name: hlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/hlint-setup@v2
      - uses: haskell-actions/hlint-run@v2
        with:
          path: '["src/", "test/", "app/"]'
          fail-on: suggestion
